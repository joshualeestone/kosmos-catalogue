# Check the sources and build catalogue.json on every push and pull request.
# `node --test test/` names the directory, so every test file in it runs; the job fails on the
# exit code, not on reading the reporter's summary.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: node build.js --check
      - run: node --test test/
      - run: node build.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # UNSIGNED: for looking at, never for publishing (publish.yml signs what it deploys).
          name: catalogue-unsigned
          path: dist/
