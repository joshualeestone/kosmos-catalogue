# Publish the catalogue on every push to main: check, build, sign, and deploy to GitHub Pages.
# Kosmos reads it at https://installkosmos.com/catalogue/, which the site passes through to the
# Pages address (a rewrite in chaoskosmos-site's vercel.json), so the address Kosmos knows is ours
# and the host behind it can change without a Kosmos release.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node --test test/
      - run: node build.js
      - run: node sign.js
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@v4
