# Publish the catalogue on every push to main: check and build, sign, then deploy to GitHub Pages.
# Kosmos will read it at https://installkosmos.com/catalogue/, which the site will pass through to
# the Pages address (a rewrite in chaoskosmos-site's vercel.json, kosmos#4632), so the address
# Kosmos knows is ours and the host behind it can change without a Kosmos release.
#
# Three jobs, so the signing key shares a job with as little code as possible:
#   build   runs the tests and the builder; no key, read-only permissions.
#   sign    the only job that can read CATALOGUE_SIGNING_KEY (a secret of the catalogue-signing
#           environment, which only main may use). It runs three actions, each a plain node
#           action pinned to a commit (checkout, download-artifact, upload-artifact), rebuilds the
#           catalogue itself and signs it only if it matches the build job's byte for byte.
#   deploy  hands the signed files to Pages. No key. upload-pages-artifact is a composite action
#           that calls another action by tag, which is why it lives here and not beside the key.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      serial: ${{ steps.built.outputs.serial }}
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      # A re-run of an old publish checks out its old commit; published now, it would re-ship old
      # content. Only the current tip of main is published. A run queued behind a deploy while a
      # newer commit landed also stops here; that is expected, and the newer commit's run publishes.
      - name: Refuse anything but the tip of main
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then echo "refused: $GITHUB_SHA is not the tip of main ($tip); the tip's own run publishes (to publish again, push a new commit, never re-run an old one)"; exit 1; fi
      - run: node build.js --check
      - run: node --test test/
      # The new serial must exceed the published one (build.js takes the larger of the commit time
      # and this plus one). published-serial.js decides what each answer means: a 404 counts as
      # "nothing published yet" only before the first publish.
      - name: Read the published serial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          earlier=0
          if [ ! -e published ]; then
            # Before the marker is committed: were there earlier Pages deployments whose deploy job
            # succeeded? One is enough. Captured first, so a failed request stops the step (a
            # failure inside `for ... in $(...)` would not).
            urls=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100" --jq '.[].statuses_url') || { echo "could not list earlier deployments"; exit 1; }
            for u in $urls; do
              n=$(gh api "$u" --jq '[.[]|select(.state=="success")]|length') || { echo "could not read deployment statuses"; exit 1; }
              if [ "$n" != 0 ]; then earlier=1; break; fi
            done
          fi
          code=$(curl -sSL --max-time 30 --retry 3 --retry-all-errors -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/published.json" -w '%{http_code}' \
            "https://joshualeestone.github.io/kosmos-catalogue/catalogue.json?run=${{ github.run_id }}") || code=000
          prev=$(node published-serial.js "$RUNNER_TEMP/published.json" "$code" "$earlier")
          echo "published serial: $prev"
          echo "CATALOGUE_PREVIOUS_SERIAL=$prev" >> "$GITHUB_ENV"
      - id: built
        run: |
          node build.js
          echo "serial=$(node -e 'process.stdout.write(String(require("./dist/catalogue.json").serial))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: catalogue-signing
    permissions:
      contents: read
    steps:
      # Every job that can publish re-checks the tip: a re-run of this job alone (GitHub allows it for
      # 30 days) would otherwise sign or deploy an old run's catalogue.
      - name: Refuse anything but the tip of main
        run: |
          tip=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then echo "refused: $GITHUB_SHA is not the tip of main ($tip)"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned
          path: unsigned/
      # The build job's code chooses nothing that gets signed: this job builds the catalogue again
      # from its own checkout (the same serial: previous + 1 = the built one) and signs only if
      # every file matches what the build job made, byte for byte. The runner's own node runs it:
      # build.js and sign.js need only node's built-in modules, so no setup action runs beside the key.
      - name: Rebuild and compare
        env:
          BUILT_SERIAL: ${{ needs.build.outputs.serial }}
        run: |
          case "$BUILT_SERIAL" in ''|*[!0-9]*) echo "refused: the build job gave no serial"; exit 1 ;; esac
          # The runner's own node, 20 or later (the build was measured byte-identical on 22 and 26).
          # Unicode data changes between versions; a different answer fails the comparison below.
          node -e 'const m = Number(process.versions.node.split(".")[0]); if (m < 20) { console.error("refused: node " + process.version + " is older than 20"); process.exit(1); }'
          CATALOGUE_PREVIOUS_SERIAL=$((BUILT_SERIAL - 1)) node build.js
          diff -r unsigned dist
      - run: node sign.js
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error

  deploy:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Every job that can publish re-checks the tip: a re-run of this job alone (GitHub allows it for
      # 30 days) would otherwise sign or deploy an old run's catalogue.
      - name: Refuse anything but the tip of main
        run: |
          tip=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then echo "refused: $GITHUB_SHA is not the tip of main ($tip)"; exit 1; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: dist/
      # Code and the public key from this commit (no token kept), to check the hand-off below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: repo
      # What arrives from the sign job is checked, not trusted: the signature against the committed
      # public key, and the serial against the one the build job made.
      - name: Refuse to deploy anything but the signed build
        run: node repo/check-deploy.js dist
        env:
          BUILT_SERIAL: ${{ needs.build.outputs.serial }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # A job of its own, after deploy: the github-pages deployment's status is the deploy job's result,
  # and the first-publish check reads it, so a slow poll here must not mark a real deploy as failed.
  # The next publish reads the serial from Pages, so this waits until Pages serves this one; the
  # concurrency group keeps the next run queued until it is done.
  confirm:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm Pages serves this serial
        env:
          BUILT_SERIAL: ${{ needs.build.outputs.serial }}
        run: |
          want="$BUILT_SERIAL"
          case "$want" in ''|*[!0-9]*) echo "no serial from the build job"; exit 1 ;; esac
          for i in $(seq 1 60); do
            # A failed request is "not yet": the step runs under bash -e -o pipefail, so it must not end the loop.
            got=$( (curl -sSL --max-time 30 -H 'Cache-Control: no-cache' "https://joshualeestone.github.io/kosmos-catalogue/catalogue.json?check=${{ github.run_id }}-$i" || true) | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).serial))}catch{}})' || true)
            if [ "$got" = "$want" ]; then echo "Pages serves serial $want"; exit 0; fi
            sleep 15
          done
          echo "Pages still does not serve serial $want after 15 minutes (it serves ${got:-nothing})"; exit 1
