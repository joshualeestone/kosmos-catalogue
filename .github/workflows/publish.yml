# Publish the catalogue on every push to main: check, build, sign, and deploy to GitHub Pages.
# Kosmos reads it at https://installkosmos.com/catalogue/, which the site passes through to the
# Pages address (a rewrite in chaoskosmos-site's vercel.json), so the address Kosmos knows is ours
# and the host behind it can change without a Kosmos release.
#
# The signing key is a secret of the github-pages ENVIRONMENT, which only main may deploy to, so a
# workflow on any other branch cannot read it. Every action is pinned to a commit, because this is
# the job that holds the key.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: node build.js --check
      - run: node --test test/
      - run: node build.js
      - run: node sign.js
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
