# Publish the catalogue on every push to main: check, build, sign, and deploy to GitHub Pages.
# Kosmos reads it at https://installkosmos.com/catalogue/, which the site passes through to the
# Pages address (a rewrite in chaoskosmos-site's vercel.json), so the address Kosmos knows is ours
# and the host behind it can change without a Kosmos release.
#
# The signing key is a secret of the github-pages ENVIRONMENT, which only main may deploy to, so a
# workflow on any other branch cannot read it. Every action is pinned to a commit, because this is
# the job that holds the key.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      # A re-run of an old publish checks out its old commit; published now, it would carry a higher
      # serial and roll every Kosmos back. Only the current tip of main is published.
      - name: Refuse anything but the tip of main
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then echo "refused: $GITHUB_SHA is not the tip of main ($tip); push a new commit instead of re-running"; exit 1; fi
      - run: node build.js --check
      - run: node --test test/
      # The new serial must exceed the published one (build.js takes the larger of the commit time
      # and this plus one). published-serial.js decides what each answer means: a 404 counts as
      # "nothing published yet" only before the first successful publish.
      - name: Read the published serial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          earlier=$(gh api "repos/${{ github.repository }}/actions/workflows/publish.yml/runs?status=success&per_page=1" --jq .total_count)
          code=$(curl -sSL --max-time 30 --retry 3 --retry-all-errors -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/published.json" -w '%{http_code}' \
            "https://joshualeestone.github.io/kosmos-catalogue/catalogue.json?run=${{ github.run_id }}") || code=000
          prev=$(node published-serial.js "$RUNNER_TEMP/published.json" "$code" "$earlier")
          echo "published serial: $prev"
          echo "CATALOGUE_PREVIOUS_SERIAL=$prev" >> "$GITHUB_ENV"
      - run: node build.js
      - run: node sign.js
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
